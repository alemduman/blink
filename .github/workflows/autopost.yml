name: Blink autopost

on:
  schedule:
    # Время в UTC: Баку = UTC + 4. Слоты 12:07, 16:07, 18:07, 20:07 по Баку = 08:07, 12:07, 14:07, 16:07 UTC; запуск повторяется каждые 15 минут: GitHub иногда теряет или задерживает запуски.
    # Дубль в тот же слот пропускается (state.json, поле slot). Часы слотов задаются в config.json -> schedule.hours; здесь должны совпадать (по UTC).
    - cron: '7,22,37,52 8,12,14,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка: подготовить видео, но НЕ публиковать'
        type: boolean
        default: true
      source:
        description: 'cron = запуск от внешнего планировщика (правила расписания: слоты, дубли)'
        type: string
        default: ''
      attempt:
        description: 'Служебное: номер попытки при автоповторе'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUN_KIND: ${{ github.event_name == 'schedule' && 'schedule' || (inputs.source == 'cron' && 'schedule' || github.event_name) }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Свежий main, а не коммит на момент постановки запуска в очередь: иначе запуск, ждавший очереди, не видит слот, уже занятый предыдущим, и публикует дубль
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Своя копия ffmpeg и браузера: не зависим от внешних серверов при каждом запуске
      - name: Кэш инструментов
        uses: actions/cache@v4
        with:
          path: |
            ~/ffbin
          key: tools-${{ runner.os }}-${{ hashFiles('package.json') }}-v1

      - name: Проверить ffmpeg
        timeout-minutes: 8
        run: |
          # ffmpeg и ffprobe: своя копия из кэша, иначе готовая сборка с GitHub (apt у GitHub иногда зависает), apt только запасной путь
          if [ -x ~/ffbin/ffmpeg ] && [ -x ~/ffbin/ffprobe ]; then sudo cp ~/ffbin/ffmpeg ~/ffbin/ffprobe /usr/local/bin/; fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for i in 1 2 3; do
              if timeout 180 curl -sSfL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                 && tar -xJf /tmp/ff.tar.xz -C /tmp; then
                mkdir -p ~/ffbin && cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe ~/ffbin/
                sudo cp ~/ffbin/ffmpeg ~/ffbin/ffprobe /usr/local/bin/ && break
              fi
              echo "скачать ffmpeg не удалось (попытка $i), повтор"; sleep 10
            done
          fi
          command -v ffprobe >/dev/null || (timeout 120 sudo apt-get update -qq; timeout 180 sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -n 1

      - name: Выбрать видео из очереди
        id: render
        timeout-minutes: 15
        run: node scripts/pick.mjs

      - uses: actions/configure-pages@v6
        if: steps.render.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.render.outputs.skip != 'true'
        with:
          path: out/site

      # Pages считает выкладку с тем же хэшем коммита уже сделанной и не обновляет файлы, поэтому у каждой выкладки свой уникальный номер версии
      - name: Уникальная версия выкладки
        id: pv
        if: steps.render.outputs.skip != 'true'
        run: echo "v=$(echo "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)" | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # GitHub Pages иногда отвечает 500. Пробуем выложить до 3 раз, чтобы слот не пропадал из-за чужого сбоя
      - name: Выложить видео по публичной ссылке (GitHub Pages)
        id: deploy
        if: steps.render.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ steps.pv.outputs.v }}
        uses: actions/deploy-pages@v5

      - name: Пауза перед повтором выкладки
        if: steps.render.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Выложить видео, попытка 2
        id: deploy2
        if: steps.render.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ steps.pv.outputs.v }}
        uses: actions/deploy-pages@v5

      - name: Пауза перед последним повтором
        if: steps.render.outputs.skip != 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Выложить видео, попытка 3
        id: deploy3
        if: steps.render.outputs.skip != 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ steps.pv.outputs.v }}
        uses: actions/deploy-pages@v5

      - name: Остановить, если выложить видео не удалось
        if: steps.render.outputs.skip != 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "GitHub Pages не принял видео за 3 попытки"
          exit 1

      - name: Опубликовать в Instagram
        id: publish
        timeout-minutes: 15
        if: steps.render.outputs.skip != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/publish.mjs

      - name: Убрать опубликованное из очереди
        if: steps.publish.outputs.posted == 'true'
        run: |
          git config user.name "blink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.ours.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/merge-state.mjs "$RUNNER_TEMP/state.ours.json" state.json
            node scripts/archive.mjs
            git add state.json queue posted
            git commit -q -m "Опубликован ролик $(date -u +%F)" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      # Pages считает выкладку с тем же хэшем коммита уже сделанной. Если запуск ничего не опубликовал (сбой, пробный прогон), меняем хэш, чтобы следующий запуск не залип на старом ролике
      - name: Сменить хэш коммита для следующей выкладки
        if: always() && steps.deploy.outcome != 'skipped' && steps.publish.outputs.posted != 'true'
        continue-on-error: true
        run: |
          git config user.name "blink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            date -u +%s > .deploy-marker
            git add .deploy-marker
            git commit -q -m "Служебная метка выкладки" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 4))
          done

      # Если запуск по расписанию сорвался ДО публикации (сбой установки, сборки, выкладки), он сам запускается ещё раз, до 3 попыток на слот.
      # Дублей не будет: слот записывается в state.json только после публикации, а publish.mjs перед публикацией проверяет ленту Instagram.
      - name: Повторить запуск, если он сорвался до публикации
        if: failure() && env.RUN_KIND == 'schedule' && steps.publish.outputs.posted != 'true' && steps.render.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          n="${ATTEMPT:-1}"
          if [ "$n" -lt 3 ]; then
            sleep 60
            gh workflow run autopost.yml -f source=cron -f dry_run=false -f attempt=$((n + 1)) && echo "Запуск сорвался, запущена попытка $((n + 1)) из 3"
          else
            echo "Это была 3-я попытка, больше не повторяю"
          fi
