name: Ответы на комментарии

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка: показать ответы, но не отправлять'
        type: boolean
        default: true
      reply_user:
        description: 'Разовый ответ: ник автора комментария'
        type: string
        default: ''
      reply_text:
        description: 'Разовый ответ: текст'
        type: string
        default: ''
      sample:
        description: 'Тест стиля: комментарии через | (ничего не отправляется)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Ответить на новые комментарии
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_DESC: 'короткие визуальные тесты на внимание и мозг в Reels (найди, посчитай, угадай)'
          SAMPLE_COMMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.sample || '' }}
          REPLY_TO_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.reply_user || '' }}
          REPLY_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.reply_text || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/replies.mjs
